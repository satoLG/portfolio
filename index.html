  <body style="background-color: rgb(0, 0, 0); margin: 0;">

    <!-- SVG filter for dialog bubble hand-drawn wobble effect -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
      <defs>
        <filter id="dialog-wobble" x="-10%" y="-8%" width="120%" height="160%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.028 0.022" numOctaves="3" seed="9" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
