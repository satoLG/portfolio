<!DOCTYPE html>
<html><body>
<div id="webgl" style="width:1280px;height:720px;position:relative;background:#87CEEB"></div>
<button id="mode-toggle-btn" style="position:fixed;bottom:20px;right:20px;z-index:9999;background:white;border:2px solid black;font-weight:bold;padding:8px 16px;cursor:pointer;border-radius:4px">🎨 2D</button>
<script>
// Mock Scene module for the built Renderer2D
const mockCanvas = document.createElement("canvas");
mockCanvas.width = 1280;
mockCanvas.height = 720;
mockCanvas.style.display = "block";
document.getElementById("webgl").appendChild(mockCanvas);
window.renderer = { domElement: mockCanvas };
</script>
<script type="module">
const R2D = await import("./dist/assets/Renderer2D-BFhRpu9l.js");
console.log("R2D exports:", Object.keys(R2D));
R2D.init();
R2D.start();
document.getElementById("mode-toggle-btn").onclick = () => {
	R2D.toggle();
	document.getElementById("mode-toggle-btn").textContent = R2D.isActive() ? "🌊 3D" : "🎨 2D";
};
</script>
</body></html>
